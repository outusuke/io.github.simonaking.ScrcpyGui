name: CI
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '*.*.*'
jobs:
  build:
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.simonaking.ScrcpyGui.flatpak
          manifest-path: io.github.simonaking.ScrcpyGui.json
      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: io.github.simonaking.ScrcpyGui.flatpak
  release:
    name: "Publish Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: io.github.simonaking.ScrcpyGui.flatpak
          generate_release_notes: true
          body: |
            Flatpak bundle for ScrcpyGui

            **First install:**
            ```bash
            flatpak install --user io.github.simonaking.ScrcpyGui.flatpak
            flatpak run io.github.simonaking.ScrcpyGui
            ```

            **Already installed? Update to this version:**
            ```bash
            flatpak install --user --reinstall io.github.simonaking.ScrcpyGui.flatpak
            ```
